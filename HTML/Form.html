<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  /* 1. Body and Background Styling */
  body {
    background-image: url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1920&q=80'); /* Keep your image URL here */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: white; 
    font-family: Arial, sans-serif; /* Makes the font cleaner */
  }

  /* 2. Form Container Styling */
  form {
    background-color: rgba(0, 0, 0, 0.75); /* Dark, semi-transparent box */
    max-width: 450px; /* Keeps the form from getting too wide */
    margin: 50px auto; /* Centers the form horizontally and pushes it down 50px */
    padding: 30px;
    border-radius: 10px; /* Rounds the corners of the dark box */
  }

  /* 3. Fieldset and Spacing */
  fieldset {
    border: 1px solid rgba(255, 255, 255, 0.3); /* Subtle border */
    border-radius: 5px;
    padding: 15px;
    margin-bottom: 20px; /* Space between form sections */
  }

  legend {
    font-weight: bold;
    padding: 0 5px;
  }

  /* 4. Input Fields Styling */
  input[type="text"],
  input[type="tel"],
  select {
    width: 100%; /* Makes inputs take up the full width of the box */
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border: none;
    border-radius: 4px;
    box-sizing: border-box; /* Prevents inputs from spilling outside the box */
  }

  /* 5. Button Styling */
  button {
    width: 100%;
    padding: 12px;
    background-color: #007bff; /* Nice blue color */
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
  }

  button:hover {
    background-color: #0056b3; /* Darkens the button slightly when hovered */
  }
</style>

</head>
</head></style>
</head>
<body>
    <form action="/register" method="POST" enctype="multipart/form-data">
        <fieldset>
            <legend>personal details</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="fullName" required minlength="3">

            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}"
            title="Enter a 10-digit number" required>
        </fieldset>
        
        <fieldset>
            <legend>Gender</legend>
            <input type="radio" id="m" name="gender" value="male">
            <label for="m">Male</label>
            <input type="radio" id="f" name="gender" value="female">
            <label for="f">Female</label>   
        </fieldset>

        <label for="course">Course</label>
        <select id="course" name="course" required>
            <option value="">--Select--</option>
            <option value="frontend">Frontend</option>
            </select>

            <input type="file" id="cv" name="resume" accept=".pdf">
            <label for="terms">I accept the terms</label>

            <button type="submit">Register</button>

    
    
    
    </form>
</body>
</html>
